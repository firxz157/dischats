<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Anak Hantu Chat</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#5865f2" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0b0c10; --card: #15171e; --input: #1f2330; --border: #2a2e3f;
      --primary: #5865f2; --primary-hover: #4752c4; --text: #f2f3f5;
      --text-muted: #949ba4; --danger: #ed4245; --success: #23a55a;
    }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at 10% 10%, rgba(88, 101, 242, 0.15), transparent 40%); }
    .auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; animation: fadeUp 0.5s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .logo { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .tabs { display: flex; background: var(--input); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: var(--primary); color: #fff; }
    .auth-form { display: none; flex-direction: column; gap: 14px; }
    .auth-form.active { display: flex; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    input { width: 100%; padding: 12px 14px; background: var(--input); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; transition: border 0.2s; }
    input:focus { border-color: var(--primary); }
    .btn-primary { padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .message { text-align: center; font-size: 13px; margin-top: 16px; min-height: 18px; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">👻 Anak Hantu Chat</div>
    <p class="subtitle">Sembang dengan rakan anda</p>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Log Masuk</button>
      <button class="tab" onclick="switchTab('register')">Daftar</button>
    </div>
    <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" class="btn-primary">Log Masuk</button>
    </form>
    <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
      <input type="text" id="reg-username" placeholder="Username (Untuk Login)" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Password (min 6)" minlength="6" required />
      <button type="submit" class="btn-primary">Daftar</button>
    </form>
    <p id="auth-message" class="message"></p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW Registered'));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if(tab === 'login') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
      document.getElementById('auth-message').textContent = '';
    }

    function showAuthMessage(text, type) {
      const el = document.getElementById('auth-message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) return showAuthMessage(data.error, 'error');
        showAuthMessage('✅ Pendaftaran berjaya! Sila log masuk.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } catch (err) { showAuthMessage('Ralat sambungan', 'error'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return showAuthMessage(data.error, 'error');
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        localStorage.setItem('display_name', data.display_name);
        
        showAuthMessage('✅ Log masuk berjaya!', 'success');
        setTimeout(() => window.location.href = '/chat.html', 500);
      } catch (err) { showAuthMessage('Ralat sambungan', 'error'); }
    }

    if (localStorage.getItem('token')) {
      window.location.href = '/chat.html';
    }
  </script>
</body>
</html>
