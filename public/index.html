<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Anak Hantu Chat</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f1013" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-darkest: #0f1013; --bg-card: #1e1f24; --bg-input: #17181c; --border: #2a2e3f;
      --primary: #5865f2; --primary-hover: #4752c4; --text: #f2f3f5; --text-muted: #949ba4;
      --danger: #da373c; --success: #23a55a;
    }
    
    body { 
      background: var(--bg-darkest); 
      color: var(--text); 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      overflow: hidden;
      background-image: radial-gradient(circle at 15% 50%, rgba(88, 101, 242, 0.15), transparent 30%),
                        radial-gradient(circle at 85% 30%, rgba(235, 69, 158, 0.1), transparent 30%);
    }

    /* Animasi Background */
    .bg-shapes { position: absolute; inset: 0; overflow: hidden; z-index: -1; }
    .shape { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 10s infinite ease-in-out alternate; }
    .shape-1 { width: 300px; height: 300px; background: var(--primary); top: -100px; left: -100px; }
    .shape-2 { width: 400px; height: 400px; background: #eb459e; bottom: -150px; right: -100px; animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

    .auth-card { 
      width: 100%; 
      max-width: 420px; 
      background: rgba(30, 31, 36, 0.85); 
      backdrop-filter: blur(15px);
      border: 1px solid var(--border); 
      border-radius: 20px; 
      padding: 40px 32px; 
      animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
      position: relative;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .logo { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo img { width: 32px; height: 32px; animation: floatImg 3s infinite ease-in-out; }
    @keyframes floatImg { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    
    .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    
    .tabs { display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(88, 101, 242, 0.3); }
    
    .auth-form { display: none; flex-direction: column; gap: 16px; }
    .auth-form.active { display: flex; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    
    input { width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: all 0.3s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2); }
    
    .btn-primary { padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6); }
    .btn-primary:active { transform: scale(0.98); }
    
    .message { text-align: center; font-size: 13px; margin-top: 16px; min-height: 18px; font-weight: 500; transition: all 0.3s; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
  </style>
</head>
<body>

  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <div class="auth-card">
    <div class="logo"><img src="/logo.png" alt="Logo"> Anak Hantu</div>
    <p class="subtitle">Sembang dengan rakan anda secara realtime</p>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Log Masuk</button>
      <button class="tab" onclick="switchTab('register')">Daftar</button>
    </div>
    
    <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" class="btn-primary">Log Masuk</button>
    </form>
    
    <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
      <input type="text" id="reg-username" placeholder="Username (Untuk Login)" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Password (min 6)" minlength="6" required />
      <button type="submit" class="btn-primary">Daftar Akaun</button>
    </form>
    
    <p id="auth-message" class="message"></p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW Registered'));
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if(tab === 'login') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
      document.getElementById('auth-message').textContent = '';
    }

    function showAuthMessage(text, type) {
      const el = document.getElementById('auth-message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      
      const btn = e.target.querySelector('button');
      btn.textContent = 'Mendaftar...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        
        if (!res.ok) {
          showAuthMessage(data.error, 'error');
        } else {
          showAuthMessage('✅ Pendaftaran berjaya! Sila log masuk.', 'success');
          setTimeout(() => switchTab('login'), 1500);
        }
      } catch (err) { 
        showAuthMessage('Ralat sambungan', 'error'); 
      } finally {
        btn.textContent = 'Daftar Akaun';
        btn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      const btn = e.target.querySelector('button');
      btn.textContent = 'Mengesahkan...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) {
          showAuthMessage(data.error, 'error');
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          localStorage.setItem('display_name', data.display_name);
          
          showAuthMessage('✅ Log masuk berjaya!', 'success');
          setTimeout(() => window.location.href = '/chat.html', 500);
        }
      } catch (err) { 
        showAuthMessage('Ralat sambungan', 'error'); 
      } finally {
        btn.textContent = 'Log Masuk';
        btn.disabled = false;
      }
    }

    if (localStorage.getItem('token')) {
      window.location.href = '/chat.html';
    }
  </script>
</body>
</html>
